services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: ${MONGODB_ATLAS_URI:-mongodb://mongo:27017/RestoPilot}
      MONGODB_DATABASE: RestoPilot
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:-}
      SEED_RESTAURANT_NAME: ${SEED_RESTAURANT_NAME:-}
      SEED_RESTAURANT_SLUG: ${SEED_RESTAURANT_SLUG:-}
      SEED_WHATSAPP_NUMBER: ${SEED_WHATSAPP_NUMBER:-}
      SEED_OWNER_FIRST_NAME: ${SEED_OWNER_FIRST_NAME:-}
      SEED_OWNER_LAST_NAME: ${SEED_OWNER_LAST_NAME:-}
      SEED_OWNER_PHONE_NUMBER: ${SEED_OWNER_PHONE_NUMBER:-}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-}
      SEED_SUPER_ADMIN_FIRST_NAME: ${SEED_SUPER_ADMIN_FIRST_NAME:-}
      SEED_SUPER_ADMIN_LAST_NAME: ${SEED_SUPER_ADMIN_LAST_NAME:-}
      SEED_SUPER_ADMIN_PHONE_NUMBER: ${SEED_SUPER_ADMIN_PHONE_NUMBER:-}
      SEED_SUPER_ADMIN_EMAIL: ${SEED_SUPER_ADMIN_EMAIL:-}
      SEED_SUPER_ADMIN_PASSWORD: ${SEED_SUPER_ADMIN_PASSWORD:-}
      SEED_SUPER_ADMIN_MFA_SECRET: ${SEED_SUPER_ADMIN_MFA_SECRET:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
      WHATSAPP_OTP_TEMPLATE_NAME: ${WHATSAPP_OTP_TEMPLATE_NAME:-restopilot_otp}
      WHATSAPP_OTP_TEMPLATE_LANGUAGE: ${WHATSAPP_OTP_TEMPLATE_LANGUAGE:-en}
      CORS_ORIGINS: http://localhost:4200,http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo_data:
  redis_data:
